[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanogt"
version = "0.1.0"
description = "Nano-rare gene therapy matching framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15.0",
    "requests>=2.32.0",
    "requests-cache>=1.2.0",
    "pydantic>=2.10.0",
    "jinja2>=3.1.0",
    "pandas>=2.2.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "respx>=0.22.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pygount>=3.2.0",
]

[project.scripts]
nanogt = "nanogt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nanogt"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
