<svg viewBox="0 0 900 1400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Gene Therapy Decision Flowchart</title>
  <desc>A decision flowchart for evaluating rare diseases as gene therapy candidates.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/></marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d97706"/></marker>
  </defs>
  <rect width="900" height="1400" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Gene Therapy Feasibility Decision Framework</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" fill="#6b7280">For loss-of-function rare diseases — nano-rare-gt dissertation</text>
  <rect x="325" y="72" width="250" height="44" rx="22" fill="#111827"/>
  <text x="450" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="white">Rare Disease Identified</text>
  <line x1="450" y1="116" x2="450" y2="144" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="450,148 580,196 450,244 320,196" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Loss-of-function</text>
  <text x="450" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">mechanism?</text>
  <text x="468" y="258" font-size="10" font-weight="700" fill="#16a34a">YES</text>
  <text x="588" y="200" font-size="10" font-weight="700" fill="#ef4444">NO / UNKNOWN</text>
  <line x1="580" y1="196" x2="700" y2="196" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="700" y="174" width="172" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="786" y="194" text-anchor="middle" font-size="10" fill="#991b1b">Out of scope</text>
  <text x="786" y="208" text-anchor="middle" font-size="10" fill="#991b1b">(GoF / DN / complex)</text>
  <line x1="450" y1="244" x2="450" y2="274" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <polygon points="450,278 580,318 450,358 320,318" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Causative gene</text>
  <text x="450" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">identified?</text>
  <text x="468" y="372" font-size="10" font-weight="700" fill="#16a34a">YES</text>
  <text x="588" y="322" font-size="10" font-weight="700" fill="#ef4444">NO</text>
  <line x1="580" y1="318" x2="700" y2="318" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="700" y="296" width="172" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="786" y="316" text-anchor="middle" font-size="10" fill="#991b1b">Research gap —</text>
  <text x="786" y="330" text-anchor="middle" font-size="10" fill="#991b1b">gene discovery needed</text>
  <line x1="450" y1="358" x2="450" y2="390" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <polygon points="450,394 580,440 450,486 320,440" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="434" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Gene fits AAV</text>
  <text x="450" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">(&lt;4.7 kb CDS)?</text>
  <text x="468" y="500" font-size="10" font-weight="700" fill="#16a34a">YES</text>
  <text x="588" y="444" font-size="10" font-weight="700" fill="#d97706">NO</text>
  <line x1="580" y1="440" x2="700" y2="440" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <rect x="700" y="414" width="172" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="786" y="434" text-anchor="middle" font-size="10" fill="#92400e">Workaround needed:</text>
  <text x="786" y="448" text-anchor="middle" font-size="10" fill="#92400e">micro/truncated protein,</text>
  <text x="786" y="462" text-anchor="middle" font-size="10" fill="#92400e">dual-AAV, or LNP</text>
  <line x1="450" y1="486" x2="450" y2="516" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <polygon points="450,520 580,562 450,604 320,562" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="556" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Target tissue /</text>
  <text x="450" y="572" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">cell type known?</text>
  <text x="468" y="618" font-size="10" font-weight="700" fill="#16a34a">YES</text>
  <text x="588" y="566" font-size="10" font-weight="700" fill="#ef4444">NO</text>
  <line x1="580" y1="562" x2="700" y2="562" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="700" y="540" width="172" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="786" y="560" text-anchor="middle" font-size="10" fill="#991b1b">Biology insufficiently</text>
  <text x="786" y="574" text-anchor="middle" font-size="10" fill="#991b1b">characterised</text>
  <line x1="450" y1="604" x2="450" y2="634" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <polygon points="450,638 580,684 450,730 320,684" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="678" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">AAV serotype with</text>
  <text x="450" y="694" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">tissue tropism exists?</text>
  <text x="468" y="744" font-size="10" font-weight="700" fill="#16a34a">YES</text>
  <text x="588" y="688" font-size="10" font-weight="700" fill="#d97706">NO</text>
  <line x1="580" y1="684" x2="700" y2="684" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <rect x="700" y="658" width="172" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="786" y="678" text-anchor="middle" font-size="10" fill="#92400e">Vector engineering</text>
  <text x="786" y="692" text-anchor="middle" font-size="10" fill="#92400e">barrier — capsid</text>
  <text x="786" y="706" text-anchor="middle" font-size="10" fill="#92400e">development needed</text>
  <line x1="450" y1="730" x2="450" y2="760" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <polygon points="450,764 580,814 450,864 320,814" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="802" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Other biological</text>
  <text x="450" y="818" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">barriers?</text>
  <text x="450" y="834" text-anchor="middle" font-size="9" fill="#6b7280">(immune, timing, toxicity)</text>
  <text x="468" y="878" font-size="10" font-weight="700" fill="#16a34a">NO</text>
  <text x="588" y="818" font-size="10" font-weight="700" fill="#d97706">YES</text>
  <line x1="580" y1="814" x2="700" y2="814" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <rect x="700" y="790" width="172" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="786" y="810" text-anchor="middle" font-size="10" fill="#92400e">Characterise barrier:</text>
  <text x="786" y="824" text-anchor="middle" font-size="10" fill="#92400e">immune privilege, dev.</text>
  <text x="786" y="838" text-anchor="middle" font-size="10" fill="#92400e">window, GoF component</text>
  <line x1="450" y1="864" x2="450" y2="894" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <polygon points="450,898 580,940 450,982 320,940" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="934" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">GT clinical trial</text>
  <text x="450" y="950" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">already exists?</text>
  <text x="588" y="944" font-size="10" font-weight="700" fill="#16a34a">YES</text>
  <text x="468" y="996" font-size="10" font-weight="700" fill="#ef4444">NO</text>
  <line x1="580" y1="940" x2="700" y2="940" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="700" y="914" width="172" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="786" y="934" text-anchor="middle" font-size="10" fill="#166534">Positive control —</text>
  <text x="786" y="948" text-anchor="middle" font-size="10" fill="#166534">validate flowchart</text>
  <text x="786" y="962" text-anchor="middle" font-size="10" fill="#166534">predicts it</text>
  <line x1="450" y1="982" x2="450" y2="1012" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <polygon points="450,1016 580,1060 450,1104 320,1060" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="1050" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Economic / prevalence</text>
  <text x="450" y="1066" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">barrier only?</text>
  <text x="450" y="1082" text-anchor="middle" font-size="9" fill="#6b7280">(&lt;1000 patients? no commercial incentive?)</text>
  <text x="468" y="1118" font-size="10" font-weight="700" fill="#7c3aed">YES</text>
  <text x="588" y="1064" font-size="10" font-weight="700" fill="#ef4444">NO / unclear</text>
  <line x1="580" y1="1060" x2="700" y2="1060" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="700" y="1036" width="172" height="52" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="786" y="1056" text-anchor="middle" font-size="10" fill="#991b1b">Unknown barrier —</text>
  <text x="786" y="1070" text-anchor="middle" font-size="10" fill="#991b1b">needs investigation</text>
  <text x="786" y="1084" text-anchor="middle" font-size="10" fill="#991b1b">(literature review)</text>
  <line x1="450" y1="1104" x2="450" y2="1136" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="1140" width="360" height="70" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="1163" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">KEY FINDING</text>
  <text x="450" y="1181" text-anchor="middle" font-size="11" fill="#5b21b6">Biologically feasible — no therapy exists</text>
  <text x="450" y="1197" text-anchor="middle" font-size="11" fill="#5b21b6">Gap = economics, not science</text>
  <rect x="28" y="1234" width="844" height="148" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="450" y="1255" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Your 5 diseases through the flowchart</text>
  <text x="44" y="1272" font-size="9" font-weight="700" fill="#6b7280">DISEASE</text>
  <text x="280" y="1272" font-size="9" font-weight="700" fill="#6b7280">STOPS AT</text>
  <text x="500" y="1272" font-size="9" font-weight="700" fill="#6b7280">RESULT</text>
  <text x="44" y="1290" font-size="10" fill="#111827">SMA (ORPHA:70)</text>
  <text x="280" y="1290" font-size="10" fill="#111827">Passes all nodes → Trial exists</text>
  <text x="500" y="1290" font-size="10" fill="#166534">Positive control (Zolgensma)</text>
  <text x="44" y="1307" font-size="10" fill="#111827">Haemophilia B (ORPHA:306)</text>
  <text x="280" y="1307" font-size="10" fill="#111827">Passes all nodes → Trial exists</text>
  <text x="500" y="1307" font-size="10" fill="#166534">Positive control (Hemgenix)</text>
  <text x="44" y="1324" font-size="10" fill="#111827">Fabry disease (ORPHA:324)</text>
  <text x="280" y="1324" font-size="10" fill="#111827">Passes all → Trial exists (debated)</text>
  <text x="500" y="1324" font-size="10" fill="#166534">Novel precedent match: RGX-121</text>
  <text x="44" y="1341" font-size="10" fill="#111827">Sanfilippo A (ORPHA:79269)</text>
  <text x="280" y="1341" font-size="10" fill="#111827">Passes all → Trial exists</text>
  <text x="500" y="1341" font-size="10" fill="#166534">ABO-101 programme</text>
  <text x="44" y="1358" font-size="10" fill="#111827">Crigler-Najjar I (ORPHA:1060)</text>
  <text x="280" y="1358" font-size="10" fill="#111827">Passes all → No trial → Econ barrier</text>
  <text x="500" y="1358" font-size="10" fill="#5b21b6">KEY FINDING — gap disease</text>
</svg>
